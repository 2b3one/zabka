name: Auto-aktualizacja promocji Żabki

on:
  schedule:
    - cron: '0 5 * * *'  # 7:00 rano czasu polskiego CEST
  workflow_dispatch: # pozwala odpalić ręcznie z zakładki Actions

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4 lxml

      - name: Scrapuj promocje z Żabki
        run: python scraper.py

      - name: Commit i push jeśli są zmiany
        run: |
          git config user.name "Żabka Bot"
          git config user.email "bot@users.noreply.github.com"
          git add promos.json
          git diff --staged --quiet || git commit -m "Auto-update: promocje Żabki $(date +'%Y-%m-%d')"
          git push